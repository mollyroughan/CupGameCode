const svg = document.getElementById("svg");
const W = svg.clientWidth;

const NODE_W = DATA.node_width;
const NODE_H = DATA.node_height;
const FONT = DATA.font_size;
const VSPACE = DATA.vertical_spacing;

const nodes = new Map(DATA.nodes.map(n => [n.id, n]));
const out = new Map();
for (const e of DATA.edges) {
  if (!out.has(e.source)) out.set(e.source, []);
  out.get(e.source).push(e.target);
}

// BFS layering
const depth = new Map([[DATA.start, 0]]);
const q = [DATA.start];

while (q.length) {
  const u = q.shift();
  const du = depth.get(u);
  for (const v of (out.get(u) || [])) {
    if (!depth.has(v)) {
      depth.set(v, du + 1);
      q.push(v);
    }
  }
}

const layers = new Map();
for (const [id, d] of depth.entries()) {
  if (!layers.has(d)) layers.set(d, []);
  layers.get(d).push(id);
}

const pos = new Map();
const maxD = Math.max(...layers.keys());

for (let d = 0; d <= maxD; d++) {
  const layer = layers.get(d) || [];
  const y = 60 + d * VSPACE;
  const spacing = (W - 80) / Math.max(1, layer.length);
  for (let i = 0; i < layer.length; i++) {
    const x = 40 + i * spacing;
    pos.set(layer[i], {x, y});
  }
}

let expanded = new Set([DATA.start]);

function clear() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function draw() {
  clear();

  // nodes that currently have visible incoming edges
  const activeTargets = new Set();

  // edges
  for (const u of expanded) {
    const pu = pos.get(u);
    for (const v of (out.get(u) || [])) {
      const pv = pos.get(v);
      if (!pu || !pv) continue;

      activeTargets.add(v);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", pu.x);
      line.setAttribute("y1", pu.y);
      line.setAttribute("x2", pv.x);
      line.setAttribute("y2", pv.y);
      line.setAttribute("stroke", "#aaa");
      svg.appendChild(line);
    }
  }

  // nodes
  for (const [id, p] of pos.entries()) {
    const n = nodes.get(id);
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.classList.add("node");

    g.addEventListener("click", () => {
      if (expanded.has(id)) expanded.delete(id);
      else expanded.add(id);
      draw();
    });

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", p.x - NODE_W/2);
    rect.setAttribute("y", p.y - NODE_H/2);
    rect.setAttribute("width", NODE_W);
    rect.setAttribute("height", NODE_H);
    rect.setAttribute("rx", 10 * (NODE_W/90));
    rect.setAttribute("stroke", "#333");
    rect.setAttribute("stroke-width", (id === DATA.start) ? "3" : "1.5");

    const isActive = activeTargets.has(id);

    if (n.terminal) {
      rect.setAttribute("fill", isActive ? "#9ec9f5" : "#d6eaff");
    } else {
      rect.setAttribute("fill", isActive ? "#dddddd" : "#ffffff");
    }

    g.appendChild(rect);

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", p.x);
    text.setAttribute("y", p.y + 4);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", FONT);
    text.setAttribute("class", "label");
    text.textContent = n.state;
    g.appendChild(text);

    svg.appendChild(g);
  }
}

draw();
